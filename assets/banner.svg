<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="50%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#2dd4ef" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <ellipse cx="190" cy="185" rx="260" ry="200" fill="url(#glowCyan)"/>
  <ellipse cx="760" cy="90" rx="340" ry="180" fill="url(#glowViolet)"/>

  <!-- terminal window card -->
  <rect x="20" y="20" width="1160" height="280" rx="16" fill="#0a1119" stroke="url(#cardBorder)" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="42" rx="16" fill="#0d1620"/>
  <rect x="20" y="46" width="1160" height="16" fill="#0d1620"/>
  <circle cx="46" cy="41" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="41" r="6" fill="#febc2e"/>
  <circle cx="86" cy="41" r="6" fill="#28c840"/>
  <text x="600" y="46" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="13" fill="#5a7083">wifi_dump.sh — bash</text>
  <line x1="20" y1="62" x2="1180" y2="62" stroke="#17222e" stroke-width="1"/>

  <!-- wifi glyph -->
  <g transform="translate(95,98) scale(5.2)" fill="none" stroke-linecap="round">
    <path d="M2 8.5a16 16 0 0 1 20 0" stroke="#6366f1" stroke-width="1.5" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M5 13a10 10 0 0 1 14 0" stroke="#38bdf8" stroke-width="1.6" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M8.5 16.5a5 5 0 0 1 7 0" stroke="#22d3ee" stroke-width="1.8">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="12" cy="20" r="1.3" fill="#e0fbff" filter="url(#soft)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="20" r="1.3" fill="#e0fbff"/>
  </g>

  <!-- prompt line -->
  <text x="330" y="105" font-family="SFMono-Regular,Consolas,monospace" font-size="18" fill="#4ade80">
    $<tspan dx="10" fill="#82a0ae">sudo ./wifi_dump.sh --all</tspan><tspan fill="#4ade80">_</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- title -->
  <text x="328" y="168" font-family="SFMono-Regular,Consolas,monospace" font-size="60" font-weight="700" fill="url(#titleGrad)" letter-spacing="0.5">wifi_dump</text>

  <!-- subtitle -->
  <text x="330" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#93a9b8">Recovers saved Wi-Fi passwords from the box you run it on &#8212; no scanning, no cracking.</text>

  <!-- backend pills -->
  <g font-family="SFMono-Regular,Consolas,monospace" font-size="13.5" fill="#bcd4e0">
    <rect x="330" y="222" width="80"  height="26" rx="13" fill="#11202c" stroke="#223745"/>
    <text x="370" y="239" text-anchor="middle">nmcli</text>
    <rect x="420" y="222" width="150" height="26" rx="13" fill="#11202c" stroke="#223745"/>
    <text x="495" y="239" text-anchor="middle">wpa_supplicant</text>
    <rect x="580" y="222" width="64"  height="26" rx="13" fill="#11202c" stroke="#223745"/>
    <text x="612" y="239" text-anchor="middle">iwd</text>
    <rect x="654" y="222" width="100" height="26" rx="13" fill="#11202c" stroke="#223745"/>
    <text x="704" y="239" text-anchor="middle">connman</text>
    <rect x="764" y="222" width="130" height="26" rx="13" fill="#11202c" stroke="#223745"/>
    <text x="829" y="239" text-anchor="middle">macOS Keychain</text>
  </g>

  <!-- author credit -->
  <text x="1148" y="280" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="14" fill="#44596a">Mohammad Sadra Naderi &#183; github.com/MS-X01</text>
</svg>
